name: Build frozen versions

# Renders the archived versions listed in archive/archived-versions.json and deploys them
# to the archive Netlify site, which docs.hazelcast.com serves through proxy rewrites.

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build archive
        run: npm run build-archive
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --no-build --dir=build/archive
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_ARCHIVE_SITE_ID }}
